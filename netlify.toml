# frotz, Inc. landing page. Static site, no build step: Netlify serves public/ as-is.

[build]
  publish = "public"
  command = ""
  # A production deploy costs Netlify credits; a Deploy Preview does not. Skip the
  # build when a push changes only files the site is not built from, so a README or
  # docs commit to main doesn't spend a production deploy. Netlify skips when this
  # exits 0 and builds otherwise. The first test always builds when there is no
  # previous deploy to compare with (Netlify sets CACHED_COMMIT_REF to COMMIT_REF
  # then, the diff would be empty, and the deploy would be skipped).
  # Not built from: the README, docs/ and tools/ (the og-image renderer; its output is
  # committed under public/), and .github/.
  ignore = "test \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" && exit 1; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . \":(exclude)README.md\" \":(exclude)docs\" \":(exclude)tools\" \":(exclude).github\""

# Security headers for every response.
# The site loads nothing third-party: fonts, styles, script, and images are all served from this
# origin, except Plausible analytics (script-src and connect-src: https://plausible.io).
# If you add another script or embed, add its origin here.
#
# Netlify's free plan injects a "Powered by Netlify" badge (/.netlify/scripts/hud) that renders
# with inline script and styles in a srcdoc iframe, and whose popover has a form that submits to
# app.netlify.com. Hence 'unsafe-inline' on script-src/style-src and the form-action origin.
# On a paid plan without the badge, drop both back to 'self' and form-action to 'none'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://plausible.io; manifest-src 'self'; base-uri 'self'; form-action https://app.netlify.com; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fonts never change in place (rename the file if you ever replace one), so cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and icons: a week in the browser. HTML, CSS, and JS keep Netlify's default
# (revalidate on every load), so edits show up immediately after a deploy.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
